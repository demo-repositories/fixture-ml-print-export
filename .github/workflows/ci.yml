# Generated by demo-template baseline 2026.10.16.3.
# Do not hand-edit; rerun normalization to update.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard-ci:
    name: Standard CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate React family versions
        run: node .github/scripts/validate-react-family.mjs
      - name: Materialize safe build-time environment
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
        run: node .github/scripts/materialize-validation-env.mjs
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm run --if-present typegen:check
      - run: pnpm test
      - run: pnpm build
