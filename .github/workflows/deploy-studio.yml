# Generated by demo-template baseline 2026.10.16.9.
# Do not hand-edit; rerun normalization to update.
name: Deploy Studio

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Studio
        working-directory: apps/studio
        env:
          CI: '1'
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || secrets.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || secrets.SANITY_DATASET }}
          SANITY_STUDIO_APP_ID: ${{ vars.SANITY_STUDIO_APP_ID || secrets.SANITY_STUDIO_APP_ID }}
          SANITY_STUDIO_HOST: ${{ vars.SANITY_STUDIO_HOST || secrets.SANITY_STUDIO_HOST }}
          SANITY_STUDIO_PREVIEW_URL: ${{ vars.SANITY_STUDIO_PREVIEW_URL || secrets.SANITY_STUDIO_PREVIEW_URL }}
          SANITY_STUDIO_PRESENTATION_URL: ${{ vars.SANITY_STUDIO_PRESENTATION_URL || secrets.SANITY_STUDIO_PRESENTATION_URL }}
          SANITY_STUDIO_SSO_LOGIN_URL: ${{ vars.SANITY_STUDIO_SSO_LOGIN_URL || secrets.SANITY_STUDIO_SSO_LOGIN_URL }}
        run: |
          set -euo pipefail
          for name in SANITY_STUDIO_PROJECT_ID SANITY_STUDIO_DATASET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Studio setting: ${name}"
              exit 2
            fi
          done
          if [[ -n "${SANITY_STUDIO_HOST}" ]]; then
            pnpm exec sanity deploy --url "${SANITY_STUDIO_HOST}" --yes
          elif [[ -n "${SANITY_STUDIO_APP_ID}" ]]; then
            pnpm exec sanity deploy --yes
          else
            echo "No Studio deployment target is configured" >&2
            exit 2
          fi
